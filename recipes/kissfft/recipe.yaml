schema_version: 1

# kissfft — FFT backend for pj_scripting's marker-analysis bandPower primitive.
# Not on conda-forge. Built static with datatype=float (mirrors the Conan
# kissfft/131.1.0 defaults; pj_scripting consumes kiss_fftr.h with
# kiss_fft_scalar = float). Ships the committed kissfft-config.cmake (same
# pattern as luau/cloudini/libmcap) instead of upstream's installed config,
# which CMake >= 4 rejects (cmake_minimum_required 3.3) and which hides the
# canonical kissfft::kissfft target behind a COMPONENT.

context:
  version: "131.1.0"

package:
  name: kissfft
  version: ${{ version }}

source:
  url: https://github.com/mborgerding/kissfft/archive/refs/tags/${{ version }}.tar.gz
  sha256: 76c1aac87ddb7258f34b08a13f0eebf9e53afa299857568346aa5c82bcafaf1a

build:
  number: 0
  script:
    # Unix: build against the conda cross-compiler ($CC/$CXX) whose default
    # sysroot is the conda glibc (2.28) — same rationale as the luau recipe.
    # Static + PIC: the archive links into pj_scripting_core and ultimately
    # into shared plugin objects.
    # Post-install, the committed kissfft-config.cmake replaces upstream's
    # (CMake-4-incompatible; see its header), and the now-unreferenced
    # kissfft-*-targets*.cmake exports are dropped.
    - if: unix
      then:
        - cmake -G Ninja -B build -S . -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_INCLUDEDIR=include -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_BINDIR=bin -DKISSFFT_STATIC=ON -DKISSFFT_DATATYPE=float -DKISSFFT_TEST=OFF -DKISSFFT_TOOLS=OFF -DKISSFFT_PKGCONFIG=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        - cmake --build build
        - cmake --install build
        - rm -f "$PREFIX"/lib/cmake/kissfft/kissfft-*-targets*.cmake
        - cp "$RECIPE_DIR/kissfft-config.cmake" "$PREFIX/lib/cmake/kissfft/kissfft-config.cmake"
    # Windows: conda's library tree is %LIBRARY_PREFIX% (…\Library); MSVC comes
    # from rattler-build's internal vs2022 activation, same as luau. The
    # CMAKE_INSTALL_*DIR values must be passed explicitly: upstream only
    # include()s GNUInstallDirs on Linux, so on Windows they are empty and the
    # headers/config install to absolute-root paths (/kissfft, /cmake/kissfft)
    # instead of under the prefix.
    - if: win
      then:
        - cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_INSTALL_INCLUDEDIR=include -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_BINDIR=bin -DKISSFFT_STATIC=ON -DKISSFFT_DATATYPE=float -DKISSFFT_TEST=OFF -DKISSFFT_TOOLS=OFF -DKISSFFT_PKGCONFIG=OFF
        - cmake --build build
        - cmake --install build
        - del /Q "%LIBRARY_PREFIX%\lib\cmake\kissfft\kissfft-float-static-targets.cmake" "%LIBRARY_PREFIX%\lib\cmake\kissfft\kissfft-float-static-targets-release.cmake"
        - copy /Y "%RECIPE_DIR%\kissfft-config.cmake" "%LIBRARY_PREFIX%\lib\cmake\kissfft\kissfft-config.cmake"

requirements:
  build:
    - ${{ compiler('cxx') }}
    # Linux only: pins the target glibc sysroot (see recipes/variants.yaml).
    # Windows/MSVC has no glibc, so the stdlib pin does not apply there.
    - if: linux
      then:
        - ${{ stdlib('c') }}
    - cmake
    - ninja

about:
  homepage: https://github.com/mborgerding/kissfft
  license: BSD-3-Clause
  summary: KISS FFT — a mixed-radix Fast Fourier Transform library that keeps it simple
